name: Deploy PWA to GitHub Pages

# Этот репозиторий — ТОЛЬКО PWA (pwa/ из монорепо опубликован как корень).
# BASE_PATH = /<имя-репозитория> — приложение живёт в подкаталоге project-сайта.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build (with repo base path)
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - name: SPA deep-link + Jekyll fixes
        run: |
          cp build/index.html build/404.html   # GitHub отдаёт 404.html на неизвестные пути → грузит SPA
          touch build/.nojekyll                 # иначе Jekyll прячет _app/ (имена с подчёркиванием)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
